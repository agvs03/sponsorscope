<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unsubscribe — SponsorPilot</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <header class="site-header"><div class="wrap header-row"><div class="brand"><h1><a href="./" style="color:inherit;text-decoration:none">Sponsor<span>Pilot</span></a></h1></div></div></header>
  <main class="wrap" style="max-width:640px">
    <h2>Job alert emails</h2>
    <p id="msg" class="meta">Turning off this alert…</p>
    <p><a href="./">← Back to jobs</a></p>
  </main>
  <script src="config.js?v=5"></script>
  <script>
    // One-click unsubscribe: the token identifies one saved search; the
    // unsubscribe() database function turns off only that alert's emails.
    (async () => {
      const msg = document.getElementById("msg");
      const token = new URLSearchParams(location.search).get("t") || "";
      const cfg = window.SPONSORPILOT_CONFIG || {};
      if (!/^[0-9a-f-]{36}$/i.test(token) || !cfg.supabaseUrl) { msg.textContent = "This unsubscribe link isn't valid."; return; }
      try {
        const r = await fetch(cfg.supabaseUrl + "/rest/v1/rpc/unsubscribe", {
          method: "POST",
          headers: { apikey: cfg.supabaseAnonKey, Authorization: "Bearer " + cfg.supabaseAnonKey, "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        const ok = r.ok && (await r.json()) === true;
        msg.textContent = ok ? "✓ You won't get emails for this alert anymore. Manage other alerts from the Account menu."
                             : "We couldn't find that alert — it may already be off or deleted.";
      } catch { msg.textContent = "Something went wrong. Please try again, or turn the alert off in the Account menu."; }
    })();
  </script>
</body>
</html>
