# Generated by scripts/export-companies.mjs — edit that script, not this file.
# career-ops scanner config for the public SponsorPilot feed: one board per
# employer with an H-1B filing history (DOL LCA), public tech-role filters, US only.

title_filter:
  positive:
    - "Engineer"
    - "Developer"
    - "Scientist"
    - "Architect"
    - "Programmer"
    - "Analyst"
    - "SRE"
    - "DevOps"
    - "Machine Learning"
    - "Data"
    - "Software"
    - "AI"
    - "ML"
    - "Full Stack"
    - "Backend"
    - "Frontend"
    - "Cloud"
    - "Security"
  negative:
    - "Intern"
    - "Internship"
    - "Co-op"
    - "Sales"
    - "Recruiter"
    - "Recruiting"
    - "Account Executive"
    - "Account Manager"
    - "Marketing"
    - "Nurse"
    - "Driver"
    - "Technician"
    - "Warehouse"
    - "Customer Success"
    - "Paralegal"
    - "Attorney"

location_filter:
  always_allow:
    - "United States"
    - "USA"
  allow:
    - "United States"
    - "USA"

max_posting_age_days: 30

