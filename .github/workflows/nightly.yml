name: Nightly job feed

# Every night: scan each sponsoring employer's public career board (career-ops
# scanner, feed/portals.yml), rebuild web/data/jobs.json, commit the feed state,
# and redeploy the site. A push made with GITHUB_TOKEN does not trigger other
# workflows, and deploying from this job would reuse the starting commit's
# Pages version (so the new data would not go live). Instead it dispatches
# deploy.yml, which builds from the new commit on main.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 2:00 AM CDT (1:00 AM CST in winter)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the Deploy site workflow after committing the feed

concurrency:
  group: nightly-feed
  cancel-in-progress: false

env:
  # career-ops scanner, pinned so an upstream change can't break the feed unannounced.
  SCANNER_REPO: career-ops-hq/career-ops
  SCANNER_REF: 8dfa557a557064f64e3a9c1a2495d90e50b70e51

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out the career-ops scanner
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCANNER_REPO }}
          ref: ${{ env.SCANNER_REF }}
          path: .scanner

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The scanner has no package-lock.json, so no npm cache and no `npm ci`.

      - name: Install scanner dependencies
        working-directory: .scanner
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Scan employer career boards
        run: |
          rm -rf feed/data && mkdir -p feed/data
          CAREER_OPS_ROOT="$PWD/feed" node .scanner/scan.mjs --since 30 | tail -25

      - name: Build the job feed
        # Retries resume from feed/jd-cache.json, which the builder checkpoints.
        run: |
          for i in 1 2 3 4; do
            SCANNER_DIR="$PWD/.scanner" node scripts/build-feed.mjs --max-fetch 20000 && exit 0
            echo "build-feed attempt $i failed; resuming"
          done
          exit 1

      - name: Commit feed
        id: commit
        run: |
          git config user.name "sponsorpilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/jobs.json web/data/meta.json feed/jd-cache.json feed/first-seen.json
          if git diff --cached --quiet; then echo "No changes."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Nightly feed $(date -u +%Y-%m-%d): $(node -p "require('./web/data/meta.json').jobs") jobs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Send job alert emails
        if: steps.commit.outputs.changed == 'true'
        # Skips itself until the secrets below are added (repo Settings → Secrets → Actions).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SITE_URL: https://jobs.arikatla.dev
        run: node scripts/send-alerts.mjs || echo "::warning::alert emails failed"

      - name: Deploy the new feed
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
