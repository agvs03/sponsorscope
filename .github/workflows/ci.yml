name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the site from synthetic data (proves the pipeline runs)
        run: python scripts/build_sample_site.py

      - name: Verify the exported site data
        run: |
          python - <<'PY'
          import json, pathlib
          idx = json.loads(pathlib.Path("web/data/index.json").read_text())
          emp = json.loads(pathlib.Path("web/data/employers.json").read_text())
          assert len(idx) > 0, "index.json is empty"
          assert len(emp) == len(idx), "employers/index length mismatch"
          print(f"built {len(idx)} employer profiles")
          PY

      - name: Run tests
        run: pytest -q
