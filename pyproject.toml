[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sponsorscope"
version = "0.1.0"
description = "U.S. visa-sponsorship intelligence from public DOL/USCIS data."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
